<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/job_assistant.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered!', reg))
        .catch((err) => console.log('Service Worker failed:', err));
    });
  }
</script>
    <style>
        body {
            min-height: 100vh;
            background: #f3f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 24px;
        }
        .register-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: #2457d6;
            font-weight: 700;
            text-decoration: none;
            font-size: 25px;
        }
        .brand-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
        }
        .btn-primary {
            background: #2457d6;
            border: none;
            padding: 12px;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal_ui.css') }}">
</head>
<body class="auth-page">
    <div class="register-card">
        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('template_logo') }}"
                 alt="Job Portal Logo" class="brand-logo">
            <span>Job Portal</span>
        </a>
        <h2 class="mt-4 fw-bold">Create your account</h2>
        <p class="text-secondary">Start your next career journey with us.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name"
                       name="name" placeholder="Enter your full name"
                       required maxlength="100" autocomplete="name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email"
                       name="email" placeholder="you@example.com"
                       required maxlength="120" autocomplete="email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password"
                           name="password" placeholder="Minimum 8 characters"
                           required minlength="8" autocomplete="new-password">
                    <button class="btn btn-outline-secondary password-toggle" type="button"
                            aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label">I want to</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="">Choose your role</option>
                    <option value="job_seeker" {% if selected_role == "job_seeker" %}selected{% endif %}>Find a Job</option>
                    <option value="employer" {% if selected_role == "employer" %}selected{% endif %}>Hire Candidates</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="{{ url_for('login', next=next_url) }}">Log in</a>
        </p>

        <p class="text-center mt-3 mb-0">
            <a href="{{ url_for('home') }}" class="text-secondary">
                Back to Home
            </a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll(".password-toggle").forEach((button) => {
            button.addEventListener("click", () => {
                const password = document.getElementById(button.getAttribute("aria-controls"));
                const isVisible = password.type === "text";
                password.type = isVisible ? "password" : "text";
                button.textContent = isVisible ? "Show" : "Hide";
                button.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
                button.setAttribute("aria-pressed", String(!isVisible));
            });
        });
    </script>
    {% include "_flash_toasts.html" %}
    {% include "_job_assistant.html" %}
</body>
</html>
