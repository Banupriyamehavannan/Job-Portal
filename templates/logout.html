<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log out | Job Portal</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/portal_ui.css') }}">
	<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0d6efd">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker registered!', reg))
        .catch((err) => console.log('Service Worker failed:', err));
    });
  }
</script>
</head>
<body class="auth-page">
	<main class="login-card">
		{% include "_flash_toasts.html" %}
		<h1 class="h3">Log out of Job Portal?</h1>
		<p class="text-secondary">You can sign in again whenever you are ready.</p>
		<form method="POST" action="{{ url_for('logout') }}">
			<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
			<input type="hidden" name="next" value="{{ next_url }}">
			<button class="btn btn-primary w-100" type="submit">Log out</button>
		</form>
		<a class="btn btn-outline-secondary w-100 mt-2" href="{{ next_url }}">Stay signed in</a>
	</main>
</body>
</html>
