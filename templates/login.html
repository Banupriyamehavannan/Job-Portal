<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Log In | Job Portal</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/job_assistant.css') }}">
	<style>
		body {
			min-height: 100vh;
			background: #f3f6fb;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			padding: 24px;
		}
		.login-card {
			width: 100%;
			max-width: 480px;
			background: white;
			padding: 35px;
			border-radius: 16px;
			box-shadow: 0 8px 30px rgba(0,0,0,0.08);
		}
		.brand {
			display: inline-flex;
			align-items: center;
			gap: 11px;
			color: #2457d6;
			font-weight: 700;
			text-decoration: none;
			font-size: 25px;
		}
		.brand-logo {
			width: 48px;
			height: 48px;
			object-fit: contain;
			display: block;
		}
		.btn-primary {
			background: #2457d6;
			border: none;
			padding: 12px;
		}
	</style>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/portal_ui.css') }}">
</head>
<body class="auth-page">
	<div class="login-card">
		<a href="{{ url_for('home') }}" class="brand">
			<img src="{{ url_for('template_logo') }}"
				 alt="Job Portal Logo" class="brand-logo">
			<span>Job Portal</span>
		</a>
		<h2 class="mt-4 fw-bold">Welcome back</h2>
		<p class="text-secondary">Log in to continue. Employer accounts can post a job after signing in.</p>

		<form method="POST" action="{{ url_for('login') }}">
			<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
			<input type="hidden" name="next" value="{{ request.form.get('next', request.args.get('next', '')) }}">
			<div class="mb-3">
				<label for="email" class="form-label">Email Address</label>
				<input type="email" class="form-control" id="email"
					   name="email" placeholder="you@example.com"
					   required maxlength="120" autocomplete="email">
			</div>

			<div class="mb-4">
				<label for="password" class="form-label">Password</label>
				<div class="input-group">
					<input type="password" class="form-control" id="password"
						   name="password" placeholder="Enter your password"
						   required autocomplete="current-password">
					<button class="btn btn-outline-secondary password-toggle" type="button"
							aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
				</div>
			</div>

			<button type="submit" class="btn btn-primary w-100">
				Log In
			</button>
		</form>

		<p class="text-center mt-4 mb-0">
			Don't have an account?
			<a href="{{ url_for('register', next=request.args.get('next', request.form.get('next', ''))) }}">Create an account</a>
		</p>

		<p class="text-center mt-3 mb-0">
			<a href="{{ url_for('home') }}" class="text-secondary">
				Back to Home
			</a>
		</p>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		document.querySelectorAll(".password-toggle").forEach((button) => {
			button.addEventListener("click", () => {
				const password = document.getElementById(button.getAttribute("aria-controls"));
				const isVisible = password.type === "text";
				password.type = isVisible ? "password" : "text";
				button.textContent = isVisible ? "Show" : "Hide";
				button.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
				button.setAttribute("aria-pressed", String(!isVisible));
			});
		});
	</script>
	{% include "_flash_toasts.html" %}
	{% include "_job_assistant.html" %}
</body>
</html>
